<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거북이 코딩 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Baloo+2:wght@500;700;800&family=Dongle:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: linear-gradient(180deg, #6FD8EC 0%, #1FA8D8 25%, #0466C8 60%, #023E7D 100%);
    --shell: #2E8B7A;
    --shell-dark: #1F6357;
    --sand: #FFF3D6;
    --coral: #FF7A5C;
    --coral-dark: #D94F4F;
    --leaf: #2EC4B6;
    --leaf-dark: #1A9E92;
    --sun: #FFD166;
    --deep: #023E7D;
    --ink: #1E2A28;
    --panel: #16241F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sky);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    padding: 32px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- 은은한 태양광 ---------- */
  .sunlight {
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    height: 55vh;
    background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- 둥둥 떠다니는 거품 ---------- */
  .bubble {
    position: fixed;
    bottom: -60px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15) 70%);
    animation: rise linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0.9; }
    100% { transform: translateY(-115vh) translateX(20px); opacity: 0; }
  }

  .wave-floor {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    height: 18vh;
    background: linear-gradient(180deg, rgba(2,62,125,0) 0%, rgba(1,39,80,0.55) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .seaweed {
    position: fixed;
    bottom: 0;
    width: 26px;
    height: 90px;
    background: var(--leaf);
    border-radius: 40px 40px 0 0;
    transform-origin: bottom center;
    animation: sway 3.4s ease-in-out infinite;
    z-index: 1;
    opacity: 0.85;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .mascot-turtle {
    position: fixed;
    font-size: 5.5rem;
    display: inline-block;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.25));
    animation: bob 2.6s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-14px) rotate(4deg); }
  }

  .mascot-fish {
    position: fixed;
    display: inline-block;
    font-size: 2.6rem;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
    z-index: 2;
  }
  .fish-1 { animation: swim-right 5s ease-in-out infinite; }
  .fish-2 { animation: swim-left 4.5s ease-in-out infinite; transform: scaleX(-1); }
  .fish-3 { font-size: 2rem; animation: swim-right 4s ease-in-out infinite; animation-delay: 0.8s; }
  @keyframes swim-right {
    0%, 100% { transform: translateX(0) translateY(0); }
    50% { transform: translateX(14px) translateY(-10px); }
  }
  @keyframes swim-left {
    0%, 100% { transform: scaleX(-1) translateX(0) translateY(0); }
    50% { transform: scaleX(-1) translateX(14px) translateY(-8px); }
  }

  .star-deco {
    position: fixed;
    display: inline-block;
    font-size: 1.4rem;
    animation: twinkle 2s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    z-index: 2;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.5; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .wrap { max-width: 1100px; margin: 0 auto; width: 100%; position: relative; z-index: 5; }

  header {
    text-align: center;
    margin-bottom: 64px;
  }

  header h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.8rem, 13vw, 6.5rem);
    line-height: 0.95;
    margin: 0 0 18px;
    letter-spacing: 1px;
    overflow-wrap: break-word;
  }
  header h1 span {
    display: inline-block;
    -webkit-text-stroke: 4px white;
    paint-order: stroke fill;
    text-shadow: 0 7px 0 rgba(0,0,0,0.18), 0 14px 22px rgba(0,0,0,0.28);
    padding: 0 4px;
  }
  header h1 .w1 { color: var(--sun); }
  header h1 .w2 { color: var(--coral); }
  header h1 .w3 { color: #FFFFFF; }

  header p.subtitle {
    display: inline-block;
    font-family: 'Dongle', 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 4.4vw, 1.9rem);
    color: var(--deep);
    background: rgba(255,255,255,0.96);
    border: 3px solid var(--sun);
    padding: 10px 26px;
    border-radius: 999px;
    margin: 0 0 4px 0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.15);
  }

  .site-footer {
    text-align: center;
    margin-top: 8px;
    color: #FFFFFF;
    font-weight: 700;
    font-size: 0.85rem;
  }

  .progress-wrap {
    max-width: 420px;
    margin: 0 auto 28px;
    background: rgba(255,255,255,0.6);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }

  #progress-label {
    font-weight: 700;
    color: var(--deep);
    white-space: nowrap;
    font-size: 0.95rem;
  }

  #reset-btn {
    border: none;
    background: white;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    flex-shrink: 0;
    transition: transform 0.06s ease;
  }
  #reset-btn:hover { background: var(--sun); }
  #reset-btn:active { transform: translateY(2px) rotate(-30deg); box-shadow: none; }

  .auth-box {
    max-width: 600px;
    margin: 0 auto 64px;
  }

  .auth-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #auth-logged-out .auth-row { gap: 20px; }

  .auth-row input {
    flex: 1;
    min-width: 100px;
    padding: 10px 12px;
    border: 2px solid #C9DCD5;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }
  .auth-row input:focus { border-color: var(--leaf); }

  .auth-btn {
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .auth-btn:hover { transform: translateY(-2px); }
  .auth-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  #open-login-btn, #open-signup-btn {
    font-family: 'Dongle', 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 2.3rem;
    line-height: 1;
    gap: 10px;
    border-radius: 18px;
    padding: 16px 32px 12px;
  }
  #open-login-btn { background: var(--coral); color: white; box-shadow: 0 6px 0 var(--coral-dark), 0 10px 18px rgba(0,0,0,0.25); }
  #open-signup-btn { background: var(--leaf); color: white; box-shadow: 0 6px 0 var(--leaf-dark), 0 10px 18px rgba(0,0,0,0.25); }
  #auth-logout-btn { background: var(--coral); color: white; }

  .top-right-bar {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .auth-btn-wide {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-size: 1rem;
    background: var(--leaf);
    color: white;
  }

  .auth-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .auth-modal-overlay.open { display: flex; }

  .auth-modal-content {
    background: white;
    width: 90%;
    max-width: 380px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .auth-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--sun);
    padding: 14px 20px;
    border-bottom: 3px solid var(--leaf);
  }
  .auth-modal-header h2 {
    margin: 0;
    font-size: 1.15rem;
    color: var(--deep);
  }
  .auth-modal-close {
    background: var(--coral);
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 700;
  }

  .auth-modal-body { padding: 20px; }

  .auth-modal-error {
    display: block;
    margin-top: 10px;
    color: #C0392B;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }

  #open-letter-btn { background: var(--leaf); color: white; }

  .letter-textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px 12px;
    border: 2px solid #C9DCD5;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    outline: none;
  }
  .letter-textarea:focus { border-color: var(--leaf); }

  .letter-success {
    display: block;
    margin-top: 10px;
    color: var(--deep);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }

  .teacher-message-modal .auth-modal-header { background: #E3F9F6; border-bottom-color: var(--leaf); }
  .teacher-message-modal .auth-modal-header h2 { color: var(--leaf-dark); }
  .teacher-message-body {
    white-space: pre-wrap;
    line-height: 1.6;
    color: var(--ink);
    background: #F5F9FC;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .progress-track {
    flex: 1;
    background: #E3ECE8;
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--leaf-dark), var(--leaf));
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .category-section { margin-bottom: 36px; }

  .category-header {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--sun);
    border: 2px solid var(--leaf);
    border-radius: 999px;
    padding: 8px 22px;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--deep);
    margin-bottom: 16px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
  }

  .chapter-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 22px 12px 18px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    border: 3px solid transparent;
  }

  .chapter-card:hover {
    transform: translateY(-6px) scale(1.04);
    box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 16px 24px rgba(0,0,0,0.12);
    border-color: var(--leaf);
  }

  .chapter-card:active { transform: translateY(-2px) scale(1.01); }

  .chapter-card.completed { background: #EAFBF9; }

  .chapter-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background: var(--deep);
    color: white;
    font-weight: 700;
    font-size: 0.85rem;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 #011D33;
  }

  .completed-check {
    position: absolute;
    top: -10px;
    right: -10px;
    background: var(--coral);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    box-shadow: 0 3px 0 var(--coral-dark);
  }

  .chapter-card.completed .completed-check { display: flex; }

  .chapter-emoji { font-size: 2.4rem; line-height: 1; }

  .chapter-title {
    font-weight: 700;
    font-size: 0.98rem;
    text-align: center;
    line-height: 1.35;
    word-break: keep-all;
  }

  @media (max-width: 500px) {
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .chapter-emoji { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="sunlight"></div>
<div class="wave-floor"></div>

<span class="mascot-turtle" style="bottom:7%; left:6%;">🐢</span>
<span class="mascot-fish fish-1" style="top:8%; right:8%;">🐠</span>
<span class="mascot-fish fish-2" style="bottom:6%; right:5%;">🐟</span>
<span class="mascot-fish fish-3" style="top:48%; left:4%;">🐡</span>
<span class="star-deco" style="top:16%; left:12%;">✨</span>
<span class="star-deco" style="top:38%; right:10%; animation-delay:0.6s;">⭐</span>
<span class="star-deco" style="bottom:16%; left:22%; animation-delay:1.1s;">🌟</span>

<div id="auth-logged-in" class="top-right-bar" style="display:none;">
  <button id="open-letter-btn" class="auth-btn">✉️ 메시지 보내기</button>
  <button id="auth-logout-btn" class="auth-btn">로그아웃</button>
</div>

<div class="wrap">
  <header id="landing-header">
    <h1>
      <span class="w1">TURTLE</span><br>
      <span class="w2">CODING</span><br>
      <span class="w3">PLAYGROUND</span>
    </h1>
    <p class="subtitle">🐍 터틀그래픽으로 배우는 19가지 파이썬</p>
  </header>

  <div class="auth-box">
    <div id="auth-logged-out">
      <div class="auth-row">
        <button id="open-login-btn" class="auth-btn">로그인</button>
        <button id="open-signup-btn" class="auth-btn">회원가입</button>
      </div>
    </div>
  </div>

  <p id="landing-footer" class="site-footer">
    제작: 김정이 선생님 🤍 &nbsp;|&nbsp; © 2026 Coding Playground
  </p>

  <div id="app-content" style="display:none;">
    <div id="categories"></div>
  </div>
</div>

<div id="signup-modal" class="auth-modal-overlay">
  <div class="auth-modal-content">
    <div class="auth-modal-header">
      <h2>✏️ 처음이라면 회원가입!</h2>
      <button class="auth-modal-close" data-close="signup-modal">✖</button>
    </div>
    <div class="auth-modal-body">
      <div class="auth-row">
        <input id="signup-school" placeholder="학교" autocomplete="off">
        <input id="signup-grade" placeholder="학년 (예: 5학년)" autocomplete="off">
      </div>
      <div class="auth-row" style="margin-top:8px;">
        <input id="signup-username" placeholder="이름" autocomplete="username">
        <input id="signup-password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
      </div>
      <button id="signup-submit-btn" class="auth-btn auth-btn-wide">가입하고 시작하기</button>
      <span id="signup-error" class="auth-modal-error"></span>
    </div>
  </div>
</div>

<div id="login-modal" class="auth-modal-overlay">
  <div class="auth-modal-content">
    <div class="auth-modal-header">
      <h2>🔑 로그인</h2>
      <button class="auth-modal-close" data-close="login-modal">✖</button>
    </div>
    <div class="auth-modal-body">
      <div class="auth-row">
        <input id="login-username" placeholder="이름" autocomplete="username">
        <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <button id="login-submit-btn" class="auth-btn auth-btn-wide">로그인하기</button>
      <span id="login-error" class="auth-modal-error"></span>
    </div>
  </div>
</div>

<div id="letter-modal" class="auth-modal-overlay">
  <div class="auth-modal-content">
    <div class="auth-modal-header">
      <h2>✉️ 선생님께 메시지 보내기</h2>
      <button class="auth-modal-close" data-close="letter-modal">✖</button>
    </div>
    <div class="auth-modal-body">
      <textarea id="letter-text" class="letter-textarea" placeholder="선생님께 하고 싶은 말을 적어주세요!"></textarea>
      <button id="letter-submit-btn" class="auth-btn auth-btn-wide">보내기</button>
      <span id="letter-status" class="letter-success"></span>
    </div>
  </div>
</div>

<div id="teacher-message-modal" class="auth-modal-overlay teacher-message-modal">
  <div class="auth-modal-content">
    <div class="auth-modal-header">
      <h2>💌 선생님이 보낸 메시지</h2>
      <button class="auth-modal-close" data-close="teacher-message-modal">✖</button>
    </div>
    <div class="auth-modal-body">
      <div id="teacher-message-body" class="teacher-message-body"></div>
      <button id="teacher-message-ack-btn" class="auth-btn auth-btn-wide">확인했어요!</button>
    </div>
  </div>
</div>

<div id="welcome-modal" class="auth-modal-overlay">
  <div class="auth-modal-content">
    <div class="auth-modal-header">
      <h2>👋 <span id="welcome-username-display"></span>님, 환영해요!</h2>
      <button class="auth-modal-close" data-close="welcome-modal">✖</button>
    </div>
    <div class="auth-modal-body">
      <div class="progress-wrap" style="margin: 0 0 20px;">
        <span id="progress-label">0 / 19 완료</span>
        <div class="progress-track"><div id="progress-bar"></div></div>
        <button id="reset-btn" title="진행 기록 초기화">🔄</button>
      </div>
      <button id="start-learning-btn" class="auth-btn auth-btn-wide">🚀 학습하기</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  // 거품 여러 개를 랜덤 위치/크기/속도로 생성
  const bubbleCount = 22;
  for (let i = 0; i < bubbleCount; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 8 + Math.random() * 26;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = (6 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(b);
  }

  // 화면 하단에 해초 몇 개 배치
  const seaweedSpots = [4, 14, 88, 95];
  seaweedSpots.forEach((leftPct, i) => {
    const s = document.createElement('div');
    s.className = 'seaweed';
    s.style.left = leftPct + '%';
    s.style.animationDelay = (i * 0.4) + 's';
    s.style.height = (60 + Math.random() * 50) + 'px';
    document.body.appendChild(s);
  });

  const chapters = [
    { num: 1, file: 'chapter1_shapes.html', emoji: '🔺', title: '도형 그리기' },
    { num: 2, file: 'chapter2_coloring.html', emoji: '🎨', title: '색칠하기' },
    { num: 3, file: 'chapter3_functions.html', emoji: '📦', title: '나만의 함수 만들기' },
    { num: 4, file: 'chapter4_keyboard.html', emoji: '🕹️', title: '키보드로 조종하기' },
    { num: 5, file: 'chapter5_random.html', emoji: '🎲', title: '랜덤과 좌표' },
    { num: 6, file: 'chapter6_input_variables.html', emoji: '💬', title: '입력과 변수' },
    { num: 7, file: 'chapter7_lists.html', emoji: '🛒', title: '리스트 다루기' },
    { num: 8, file: 'chapter8_modulo.html', emoji: '➗', title: '나머지 연산자' },
    { num: 9, file: 'chapter9_nested_loops.html', emoji: '🌸', title: '이중 반복문' },
    { num: 10, file: 'chapter10_conditional.html', emoji: '🤔', title: '조건문' },
    { num: 11, file: 'chapter11_parameters.html', emoji: '🏭', title: '매개변수' },
    { num: 12, file: 'chapter12_text.html', emoji: '📝', title: '텍스트와 f-문자열' },
    { num: 13, file: 'chapter13_race.html', emoji: '🏁', title: '다중 객체 경주' },
    { num: 14, file: 'chapter14_coin_collect.html', emoji: '🪙', title: '충돌 감지와 전역변수' },
    { num: 15, file: 'chapter15_tag_game.html', emoji: '🏃', title: '타이머로 계속 움직이기' },
    { num: 16, file: 'chapter16_snake1.html', emoji: '🐍', title: '스네이크 1탄' },
    { num: 17, file: 'chapter17_snake2.html', emoji: '🐍', title: '스네이크 2탄' },
    { num: 18, file: 'chapter18_snake3.html', emoji: '🐍', title: '스네이크 3탄' },
    { num: 19, file: 'chapter19_paint.html', emoji: '🖌️', title: '나만의 그림판' },
  ];

  const categories = [
    { icon: '🖍️', label: '기초 그리기', range: [1, 2] },
    { icon: '🧩', label: '함수와 이벤트', range: [3, 4] },
    { icon: '📊', label: '데이터 다루기', range: [5, 8] },
    { icon: '🧠', label: '조건과 심화', range: [9, 12] },
    { icon: '🎮', label: '미니게임 만들기', range: [13, 15] },
    { icon: '🐍', label: '스네이크 & 그림판', range: [16, 19] },
  ];

  let cloudProgress = {};  // Firestore에서 불러온 진행 기록

  function isVisited(num) {
    return !!cloudProgress[String(num)];
  }

  function renderCard(ch) {
    const visited = isVisited(ch.num);
    return `
      <a class="chapter-card${visited ? ' completed' : ''}" href="${ch.file}" data-num="${ch.num}">
        <div class="chapter-badge">${ch.num}</div>
        <div class="completed-check">✓</div>
        <div class="chapter-emoji">${ch.emoji}</div>
        <div class="chapter-title">${ch.title}</div>
      </a>
    `;
  }

  function render() {
    const container = document.getElementById('categories');
    container.innerHTML = categories.map(cat => {
      const list = chapters.filter(c => c.num >= cat.range[0] && c.num <= cat.range[1]);
      return `
        <section class="category-section">
          <div class="category-header">${cat.icon} ${cat.label}</div>
          <div class="card-grid">
            ${list.map(renderCard).join('')}
          </div>
        </section>
      `;
    }).join('');
    // 카드는 그냥 이동만 해요 — "완료" 표시는 각 차시 페이지 안의
    // "✅ 이 차시 완료!" 버튼을 눌러야만 남습니다.

    updateProgress();
  }

  function updateProgress() {
    const done = chapters.filter(c => isVisited(c.num)).length;
    document.getElementById('progress-label').textContent = `${done} / ${chapters.length} 완료`;
    document.getElementById('progress-bar').style.width = (done / chapters.length * 100) + '%';
  }

  function resetProgress() {
    if (!confirm('지금까지의 진행 기록을 모두 초기화할까요?')) return;
    cloudProgress = {};
    const user = auth.currentUser;
    if (user) db.collection('students').doc(user.uid).set({ progress: {} }, { merge: false }).catch(() => {});
    render();
  }

  document.getElementById('reset-btn').addEventListener('click', resetProgress);

  // ---------- 로그인 / 회원가입 (모달) ----------

  const FRIENDLY_ERRORS = {
    'auth/email-already-in-use': '이미 있는 이름이에요. 다른 이름을 써보세요!',
    'auth/invalid-email': '이름을 입력해주세요.',
    'auth/weak-password': '비밀번호는 6자 이상으로 만들어주세요.',
    'auth/user-not-found': '이름 또는 비밀번호가 틀렸어요.',
    'auth/wrong-password': '이름 또는 비밀번호가 틀렸어요.',
    'auth/invalid-credential': '이름 또는 비밀번호가 틀렸어요.',
    'auth/missing-password': '비밀번호를 입력해주세요.',
  };

  function showErrorIn(elId, err) {
    document.getElementById(elId).textContent = FRIENDLY_ERRORS[err.code] || ('오류가 발생했어요: ' + err.message);
  }

  function clearErrorIn(elId) {
    document.getElementById(elId).textContent = '';
  }

  function openModal(id) {
    document.getElementById(id).classList.add('open');
  }

  const MODAL_STATUS_EL = {
    'signup-modal': 'signup-error',
    'login-modal': 'login-error',
    'letter-modal': 'letter-status',
  };

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    const statusElId = MODAL_STATUS_EL[id];
    if (statusElId) clearErrorIn(statusElId);
  }

  document.getElementById('open-login-btn').addEventListener('click', () => openModal('login-modal'));
  document.getElementById('open-signup-btn').addEventListener('click', () => openModal('signup-modal'));

  document.querySelectorAll('.auth-modal-close').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.dataset.close));
  });

  document.querySelectorAll('.auth-modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });

  let lastTypedUsername = ''; // 로그인/가입 때 입력한 이름 (Firestore 값이 비어있을 때 대신 보여줄 이름)

  document.getElementById('signup-submit-btn').addEventListener('click', async () => {
    clearErrorIn('signup-error');
    const school = document.getElementById('signup-school').value;
    const grade = document.getElementById('signup-grade').value;
    const username = document.getElementById('signup-username').value;
    const password = document.getElementById('signup-password').value;
    if (!school.trim() || !grade.trim() || !username.trim() || !password) {
      showErrorIn('signup-error', { code: '', message: '학교, 학년, 이름, 비밀번호를 모두 입력해주세요.' });
      return;
    }
    try {
      lastTypedUsername = username.trim();
      await signUpStudent(school, grade, username, password);
      closeModal('signup-modal');
    } catch (err) { showErrorIn('signup-error', err); }
  });

  document.getElementById('login-submit-btn').addEventListener('click', async () => {
    clearErrorIn('login-error');
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    if (!username.trim() || !password) {
      showErrorIn('login-error', { code: '', message: '이름과 비밀번호를 입력해주세요.' });
      return;
    }
    try {
      lastTypedUsername = username.trim();
      await logInStudent(username, password);
      closeModal('login-modal');
    } catch (err) { showErrorIn('login-error', err); }
  });

  document.getElementById('auth-logout-btn').addEventListener('click', () => {
    logOutStudent();
  });

  // ---------- 선생님께 편지쓰기 ----------

  document.getElementById('open-letter-btn').addEventListener('click', () => openModal('letter-modal'));

  document.getElementById('letter-submit-btn').addEventListener('click', async () => {
    const text = document.getElementById('letter-text').value;
    if (!text.trim()) {
      document.getElementById('letter-status').textContent = '편지 내용을 적어주세요!';
      return;
    }
    try {
      await sendLetterToTeacher(text);
      document.getElementById('letter-text').value = '';
      document.getElementById('letter-status').textContent = '💌 선생님께 편지를 보냈어요!';
    } catch (e) {
      document.getElementById('letter-status').textContent = '전송 중 문제가 생겼어요. 다시 시도해주세요.';
    }
  });

  // ---------- 선생님이 보낸 메시지 확인 ----------

  document.getElementById('teacher-message-ack-btn').addEventListener('click', async () => {
    closeModal('teacher-message-modal');
    try { await markTeacherMessageRead(); } catch (e) {}
    openModal('welcome-modal');
  });

  // ---------- 환영 + 진도 모달 ----------

  document.getElementById('start-learning-btn').addEventListener('click', () => closeModal('welcome-modal'));

  function clearAuthInputs() {
    ['signup-school', 'signup-grade', 'signup-username', 'signup-password', 'login-username', 'login-password']
      .forEach(id => { document.getElementById(id).value = ''; });
  }

  onAuthChange(async (user) => {
    if (user) {
      cloudProgress = await getStudentProgress();
      const cloudName = await getStudentName();
      const name = cloudName || lastTypedUsername || '학생';
      document.getElementById('welcome-username-display').textContent = name;
      // Firestore에 이름이 비어있었다면(예전 계정 등) 지금 입력한 이름으로 채워줘요.
      if (!cloudName && lastTypedUsername) {
        db.collection('students').doc(user.uid).set({ username: lastTypedUsername }, { merge: true }).catch(() => {});
      }
      document.getElementById('landing-header').style.display = 'none';
      document.querySelector('.auth-box').style.display = 'none';
      document.getElementById('landing-footer').style.display = 'none';
      document.getElementById('auth-logged-in').style.display = 'flex';
      document.getElementById('app-content').style.display = 'block';
      closeModal('signup-modal');
      closeModal('login-modal');
      clearAuthInputs();

      const unreadMsg = await getUnreadTeacherMessage().catch(() => null);
      if (unreadMsg) {
        document.getElementById('teacher-message-body').textContent = unreadMsg.text;
        openModal('teacher-message-modal');
      } else {
        openModal('welcome-modal');
      }
    } else {
      cloudProgress = {};
      document.getElementById('landing-header').style.display = 'block';
      document.querySelector('.auth-box').style.display = 'block';
      document.getElementById('landing-footer').style.display = 'block';
      document.getElementById('auth-logged-in').style.display = 'none';
      document.getElementById('app-content').style.display = 'none';
      closeModal('welcome-modal');
      closeModal('teacher-message-modal');
    }
    render();
  });

  render();
</script>

</body>
</html>
