<!DOCTYPE html>
<html lang="ko">

<body>
<script>
const FAST = { given: 't.speed(0)', note: '가장 빠르게!' };
const GROW = { given: 'size = size + 5', note: 'size 상자 숫자 키우기' };
const LESSON = {
  num: 11,
  topic: '커지는 달팽이',
  words: [
    { emo: '📦', en: 'size', say: '사이즈', ko: '크기 (상자 이름)' },
    { emo: '➕', en: 'size + 10', say: '사이즈 플러스 텐', ko: 'size 에 10 더한 숫자' },
    { emo: '⬆️', en: 'forward', say: '포워드', ko: '앞으로 가' },
    { emo: '↩️', en: 'left', say: '레프트', ko: '왼쪽으로 돌아' },
    { emo: '🔁', en: 'range', say: '레인지', ko: '몇 번 반복' },
  ],
  preview: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nt.color("blue")\nsize = 5\nfor i in range(40):\n    t.forward(size)\n    t.left(90)\n    size = size + 5\n`,
  missions: [
    {
      kind: 'preview', title: '오늘 만들 것 🎁',
      talk: `빙글빙글 점점 <b>커지는 달팽이</b> 🐌 를 그려요!<br>비밀은 <b>상자 속 숫자를 계속 키우는 것</b>이에요.`,
      words: true,
      done: '한 바퀴 돌 때마다 점점 커지죠? 오늘 이걸 만들어요! <b>다음 →</b>',
    },
    {
      title: '상자 숫자만큼 걷기 📦',
      talk: `10차시에 배운 <b>상자</b>예요. <b>size</b> 상자에 50을 넣어 두었어요.<br>이 숫자만큼 걷도록 <b>t.forward(size)</b> 를 써 보세요!`,
      chips: [['t.forward', '앞으로 가'], ['(size)', 'size 상자 속 숫자만큼']],
      lines: [{ prep: true }, { given: 'size = 50', note: 'size 상자에 50 넣기' }, { type: 't.forward(size)', note: '상자 속 숫자만큼 앞으로' }],
      done: '거북이가 50만큼 걸어갔어요! 👏',
    },
    {
      title: '상자 숫자 키우기 ✨',
      talk: `상자 속 숫자를 <b>바꿀</b> 수도 있어요!<br><b>size = size + 10</b> 은 <b>"지금 size 에 10을 더해서, 다시 size 상자에 넣어!"</b> 예요.`,
      chips: [['size', '상자 이름'], ['=', '넣어!'], ['size + 10', 'size 에 10 더한 숫자']],
      sentence: '🗣️ "지금 숫자 50 에 10을 더해서(60), size 상자에 다시 넣어!"',

        { given: 't.left(90)', note: '왼쪽으로 돌기' },

    {
      kind: 'more', title: '한 번 더! 계속 키우기 🌀',
      talk: `<b>걷기 + 돌기 + 키우기</b>를 계속 하면 어떻게 될까요?<br><b>➕ 한 번 더!</b>를 눌러서 달팽이를 완성해 보세요.`,
      before: [{ given: 'size = 20', note: 'size 상자에 20' }],
      pair: [{ given: 't.forward(size)', note: 'size 만큼 걷기' }, { given: 't.left(90)', note: '왼쪽으로 돌기' }, { given: 'size = size + 10', note: '숫자 키우기' }],

      moreLabel: '걷기+돌기+키우기',
      done: '달팽이 모양이 됐어요! 🐌<br>그런데 같은 3줄을 <b>6번</b>이나 썼어요. 이제 어떻게 줄일까요? 맞아요, <b>반복</b>이죠!',
    },
    {
      title: '반복으로 달팽이 만들기 🔁',
      talk: `3줄 묶음을 <b>반복 상자</b>에 넣었어요.<br>빈칸의 <b>반복 횟수</b>를 바꾸면 달팽이가 얼마나 커질지 정할 수 있어요!`,
      lines: [
        { prep: true }, FAST,
        { given: 'size = 5', note: '작게 시작!' },
        { blank: 'for i in range(@):', answers: [null], start: ['30'], note: '몇 번 해 줘?' },
        { box: [{ given: 't.forward(size)', note: 'size 만큼 걷기' }, { given: 't.left(90)', note: '왼쪽으로 돌기' }, GROW] },
      ],
      quick: ['10', '30', '50'],
      done: '반복 횟수만 바꿨는데 달팽이 크기가 바뀌었어요! 🐌',
    },
    {
      title: '도전! 작아지는 달팽이 🔽',
      talk: `이번엔 <b>큰 숫자에서 시작</b>해서 점점 <b>작아지는</b> 달팽이예요.<br>빈칸에 <b>+</b> 대신 무엇을 써야 숫자가 줄어들까요?`,
      lines: [
        { prep: true }, FAST,
        { given: 'size = 200', note: '크게 시작!' },
        { given: 'for i in range(35):', note: '35번 해 줘!' },

          { given: 't.forward(size)', note: 'size 만큼 걷기' },
          { given: 't.left(90)', note: '왼쪽으로 돌기' },
          { blank: 'size = size @ 5', answers: ['-'], start: ['+'], note: '숫자 줄이기' },
        ] },
      ],
      hint: '더하기는 <b>+</b>, 빼기는 <b>-</b> 예요. 빈칸에 <b>-</b> 를 써 보세요.',
      done: '바깥에서 안쪽으로 빙글빙글! 🌀 숫자가 줄어드니까 작아졌어요.',
    },
    {
      kind: 'free', title: '나만의 달팽이 🎨',
      talk: `<b>left(90)</b> 의 숫자를 <b>60</b> 이나 <b>100</b> 으로 바꿔 보세요. 전혀 다른 무늬가 나와요!<br><span class="small">색깔과 반복 횟수, 키우는 숫자(+ 5)도 바꿔 봐요.</span>`,
      code: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nt.color("orange")\n\nsize = 5\nfor i in range(40):\n    t.forward(size)\n    t.left(90)\n    size = size + 5\n`,
      done: '오늘의 미션을 모두 끝냈어요! 🏆 아래 <b>완료</b> 버튼을 눌러 주세요.',
    },
  ],
};
