<script>
const SHOW = { given: 't.write(f"Score: {score}", font=("Arial", 24, "bold"))', note: '점수판 쓰기' };
const LESSON = {
  num: 19,
  topic: '점수판 만들기',
  words: [
    { emo: '📦', en: 'score', say: '스코어', ko: '점수 (상자 이름)' },
    { emo: '🔗', en: 'f"..."', say: '에프', ko: '글자와 상자 합치기' },
    { emo: '{ }', en: '{score}', say: '', ko: '상자 속 값이 들어갈 자리' },
    { emo: '🧽', en: 'clear', say: '클리어', ko: '글씨 지우기' },
    { emo: '✍️', en: 'write', say: '라이트', ko: '글씨 쓰기' },
  ],
  preview: `import turtle\nt = turtle.Turtle()\nt.hideturtle()\nt.penup()\nt.goto(-80, -10)\nt.color("darkgreen")\nscore = 0\nfor i in range(3):\n    score = score + 10\n    t.clear()\n    t.write(f"Score: {score}", font=("Arial", 36, "bold"))\n`,
  missions: [
    {
      kind: 'preview', title: '오늘 만들 것 🎁',
      talk: `게임 화면에 <b>"Score: 30"</b> 같은 <b>점수판</b>이 있죠? 🏆<br>점수가 바뀔 때마다 글씨도 바뀌어야 해요. 어떻게 만들까요?`,
      words: true,
      done: '점수가 쌓여서 <b>Score: 30</b> 이 나왔어요! 오늘 이걸 만들어요. <b>다음 →</b>',
    },
    {
      title: '상자 속 점수를 글씨로 🔗',
      talk: `<b>score</b> 상자에 점수 10이 들어 있어요. 이 숫자를 글씨 속에 넣으려면 글자 앞에 <b>f</b> 를 붙이고, 숫자가 들어갈 자리에 <b>{score}</b> 를 써요.<br>이렇게 쓰면 <b>{ }</b> 자리에 상자 속 점수가 쏙 들어가요!`,
      chips: [['f"Score: {score}"', 'f + 글자 + {상자 이름}'], ['{score}', '상자 속 점수가 들어갈 자리']],
      sentence: '🗣️ "Score: 라고 쓰고, 그 뒤에 score 상자 속 숫자를 붙여서 써!"',
      lines: [{ prep: true }, { given: 'score = 10', note: 'score 상자에 10' }, { type: 't.write(f"Score: {score}")', note: '점수 글씨 쓰기' }],
      done: '<b>Score: 10</b> 이 써졌어요! 🏆 상자 속 숫자가 글씨에 들어갔어요.',
    },
    {
      title: '점수 바꿔 보기 🔢',
      talk: `상자 속 점수만 바꾸면 글씨도 바뀌어요.<br>숫자를 바꾸고 실행해 보세요. 버튼을 눌러도 돼요!`,
      lines: [{ prep: true }, { blank: 'score = @', answers: [null], start: ['10'], note: 'score 상자에 ?' }, SHOW],
      quick: ['0', '50', '100'],
      done: '점수 상자만 바꿨는데 글씨가 바뀌었어요! ✍️',
    },
    {
      title: '점수 올리기 ⬆️',
      talk: `점수를 <b>올리는</b> 줄은 11차시에서 배운 <b>score = score + 5</b> 예요.<br>점수를 올리고 <b>새 점수판을 다시 쓰는</b> 코드예요. <b>t.clear()</b> 는 이전 글씨를 지워요.`,
      lines: [
        { prep: true }, { given: 'score = 10', note: 'score 상자에 10' }, SHOW,
        { type: 'score = score + 5', note: '점수 올리기! (10 → 15)' },
        { given: 't.clear()', note: '이전 글씨 지우기' }, SHOW,
      ],
      done: '<b>Score: 15</b> 로 바뀌었어요! 🎉 점수가 올라서 점수판도 올랐어요.',
    },
    {
      title: '도전! 지우기 빠뜨리지 않기 🧽',
      talk: `<b>clear</b> 줄이 없으면 어떻게 될까요? 새 글씨가 옛 글씨 위에 <b>겹쳐서</b> 엉망이 돼요! 😵<br>빈칸에 <b>지우기</b> 명령을 써 보세요.`,
      lines: [
        { prep: true }, { given: 'score = 10', note: 'score 상자에 10' }, SHOW,
        { given: 'score = score + 5', note: '점수 올리기' },
        { blank: 't.@()', answers: ['clear'], note: '이전 글씨 지우기' }, SHOW,
      ],
      hint: '글씨를 지우는 영어는 <b>clear</b> (클리어) 예요.',
      done: '깔끔하게 <b>Score: 15</b> 만 보여요! 🧽',
    },
    {
      title: '점수판을 왼쪽 위로 📍',
      talk: `점수판은 보통 <b>화면 구석</b>에 있어요. 빈칸 2개로 위치를 정해 보세요!<br>왼쪽은 마이너스 가로, 위쪽은 큰 세로 숫자예요.`,
      lines: [
        { prep: true }, { given: 't.hideturtle()', note: '거북이 숨기기' }, { given: 't.penup()', note: '펜 들기' },
        { blank: 't.goto(@, @)', answers: [null, null], start: ['-200', '120'], note: '(가로, 세로) 자리로!' },
        { given: 'score = 30', note: 'score 상자에 30' }, SHOW,
      ],
      done: '점수판이 구석에 자리 잡았어요! 📍',
    },
    {
      title: '도전! 반복해서 점수 쌓기 🏆',
      talk: `<b>몇 번</b> 반복하고, <b>한 번에 몇 점</b> 올릴지 정해 보세요. 마지막 점수가 점수판에 나와요!<br>빈칸 2개에 숫자를 써 보세요.`,
      lines: [
        { prep: true }, { given: 't.hideturtle()', note: '거북이 숨기기' }, { given: 't.penup()', note: '펜 들기' },
        { given: 'score = 0', note: '0점에서 시작' },
        { blank: 'for i in range(@):', answers: [null], start: ['3'], note: '몇 번 해 줘?' },
        { box: [
          { blank: 'score = score + @', answers: [null], start: ['10'], note: '한 번에 ? 점' },
          { given: 't.clear()', note: '이전 글씨 지우기' },
          SHOW,
        ] },
      ],
      done: '점수판 완성! 🏆 마지막 점수는 <b>횟수 × 올린 점수</b> 예요. 숫자를 바꿔서 다시 해 보세요.',
    },
    {
      kind: 'free', title: '나만의 점수판 🎨',
      talk: `글씨 크기, 색깔, 위치, 올리는 점수를 마음대로 바꿔 보세요!<br><span class="small">"Score" 대신 "Coin" 이나 "Point" 도 써 볼 수 있어요.</span>`,
      code: `import turtle\nt = turtle.Turtle()\nt.hideturtle()\nt.penup()\nt.goto(-80, -10)\nt.color("blue")\n\nscore = 0\nfor i in range(5):\n    score = score + 10\n    t.clear()\n    t.write(f"Score: {score}", font=("Arial", 36, "bold"))\n`,
      done: '오늘의 미션을 모두 끝냈어요! 🏆 아래 <b>완료</b> 버튼을 눌러 주세요.',
    },
  ],
};
</script>
