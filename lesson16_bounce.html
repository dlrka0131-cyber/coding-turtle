<head>

<body>
<script>
// 빨간 벽 상자 (가로 -150~150, 세로 -90~90)
const WALL = { fold: [
  { given: 'w = turtle.Turtle()', note: '벽 그릴 거북이 w' },
  { given: 'w.hideturtle()', note: '거북이 숨기기' },
  { given: 'w.color("red")', note: '빨간색' },
  { given: 'w.pensize(4)', note: '굵게' },
  { given: 'w.penup()', note: '펜 들기' },
  { given: 'w.goto(-150, -90)', note: '왼쪽 아래 모서리로' },
  { given: 'w.pendown()', note: '펜 내리기' },
  { given: 'for side in range(2):', note: '2번 해 줘!' },
  { box: [{ given: 'w.forward(300)', note: '가로 벽' }, { given: 'w.left(90)', note: '돌기' }, { given: 'w.forward(180)', note: '세로 벽' }, { given: 'w.left(90)', note: '돌기' }] },
], title: '빨간 벽 상자 그리기 (신경 쓰지 마세요)' };
const TURN = { box: [{ given: 't.right(180)', note: '뒤로 돌기!' }] };
const LESSON = {
  num: 16,
  topic: '사방 벽에 튕기기',
  words: [
    { emo: '🤔', en: 'if', say: '이프', ko: '만약에' },
    { emo: '🔀', en: 'elif', say: '엘이프', ko: '아니면 만약에' },
    { emo: '↔️', en: 'xcor', say: '엑스 코', ko: '가로 위치' },
    { emo: '↕️', en: 'ycor', say: '와이 코', ko: '세로 위치' },
    { emo: '🔄', en: 'right(180)', say: '라이트', ko: '뒤로 돌아' },
  ],
  preview: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nw = turtle.Turtle()\nw.hideturtle()\nw.speed(0)\nw.color("red")\nw.pensize(4)\nw.penup()\nw.goto(-150, -90)\nw.pendown()\nfor side in range(2):\n    w.forward(300)\n    w.left(90)\n    w.forward(180)\n    w.left(90)\nt.color("blue")\nt.setheading(40)\nfor i in range(250):\n    t.forward(8)\n    if t.xcor() > 150:\n        t.setheading(180 - t.heading())\n    elif t.xcor() < -150:\n        t.setheading(180 - t.heading())\n    elif t.ycor() > 90:\n        t.setheading(-t.heading())\n    elif t.ycor() < -90:\n        t.setheading(-t.heading())\n`,
  missions: [
    {
      kind: 'preview', title: '오늘 만들 것 🎁',
      talk: `빨간 상자 안에서 거북이가 <b>벽에 통통 튕겨요!</b> 🏀<br>왼쪽, 오른쪽, 위, 아래 <b>네 벽</b>을 모두 지키려면 <b>"아니면 만약에"</b> 를 써야 해요.`,
      words: true,
      done: '네 벽에 모두 튕겨요! 오늘 이걸 만들어요. <b>다음 →</b>',
    },
    {
      title: '왼쪽 벽도 지키기 ⬅️',
      talk: `지난 시간엔 오른쪽 벽만 지켰어요. 이번엔 <b>왼쪽 벽</b>도 지켜요.<br><b>elif</b> 는 <b>"아니면 만약에"</b> 라는 뜻이에요. 위 if 가 아닐 때만 확인해요. 노란 줄을 직접 써 보세요!`,
      chips: [['if', '만약에'], ['elif', '아니면 만약에'], ['< -150', '-150보다 작으면 (왼쪽 벽)']],
      sentence: '🗣️ "만약에 오른쪽 벽이면 돌고, 아니면 만약에 왼쪽 벽이면 돌아!"',
      lines: [
        { prep: true }, WALL,
        { given: 't.speed(0)', note: '가장 빠르게!' },
        { given: 'for i in range(80):', note: '80번 해 줘!' },
        { box: [
          { given: 't.forward(10)', note: '앞으로 10' },
          { given: 'if t.xcor() > 150:', note: '만약에 오른쪽 벽이면' },
          TURN,
          { type: 'elif t.xcor() < -150:', note: '아니면 만약에 왼쪽 벽이면' },
          TURN,
        ] },
      ],
      done: '오른쪽 벽과 왼쪽 벽 사이를 왔다 갔다 해요! ↔️ <b>elif</b> 덕분이에요.',
    },
    {
      title: '내 세로 위치 알아보기 ↕️',
      talk: `위·아래 벽을 지키려면 <b>세로 위치</b>를 알아야 해요.<br><b>t.ycor()</b> 는 <b>"나의 세로 위치는?"</b> 이에요. 한가운데는 0, <b>위로 갈수록 커져요.</b>`,
      chips: [['t.ycor()', '내 세로 위치'], ['t.xcor()', '내 가로 위치']],
      lines: [{ prep: true }, { given: 't.left(90)', note: '위쪽을 봐' }, { given: 't.forward(100)', note: '앞으로 100 (위로!)' }, { type: 'print(t.ycor())', note: '내 세로 위치는?' }],
      done: '<b>100.0</b> 이 나왔어요! 위로 100만큼 갔으니까 세로 위치가 100이에요. ↕️',
    },
    {
      title: '도전! 위·아래 벽 지키기 ⬆️⬇️',
      talk: `이번엔 거북이가 <b>위쪽</b>으로 달려요. 아래 벽은 세로 위치가 <b>-90</b> 이에요.<br>빈칸에 <b>-90</b> 을 써 보세요. (마이너스 - 도 같이!)`,
      lines: [
        { prep: true }, WALL,
        { given: 't.speed(0)', note: '가장 빠르게!' },
        { given: 't.setheading(90)', note: '위쪽을 봐' },
        { given: 'for i in range(80):', note: '80번 해 줘!' },
        { box: [
          { given: 't.forward(10)', note: '앞으로 10' },
          { given: 'if t.ycor() > 90:', note: '만약에 위쪽 벽이면' },
          TURN,
          { blank: 'elif t.ycor() < @:', answers: ['-90'], note: '아니면 만약에 아래쪽 벽이면' },
          TURN,
        ] },
      ],
      hint: '위쪽 벽이 <b>90</b> 이니까 아래쪽 벽은 <b>-90</b> 이에요. 마이너스를 붙여요!',
      done: '위·아래 벽 사이를 오르락내리락! ↕️',
    },
    {
      title: '튕기는 마법 공식 🏀',
      talk: `이제 <b>네 벽을 모두</b> 지켜요. 그런데 비스듬히 달리는 거북이가 벽에 튕기려면 <b>마법 공식</b>이 필요해요.<br>왼쪽·오른쪽 벽은 <b>180 - 방향</b>, 위·아래 벽은 <b>-방향</b> 으로 방향을 바꿔요. <b>공식은 외우지 말고 그냥 읽고 ▶ 실행해 보세요!</b>`,
      lines: [
        { prep: true }, WALL,
        { given: 't.speed(0)', note: '가장 빠르게!' },
        { given: 't.color("blue")', note: '파란색 펜' },
        { given: 't.setheading(40)', note: '비스듬히 출발!' },
        { given: 'for i in range(250):', note: '250번 해 줘!' },
        { box: [
          { given: 't.forward(8)', note: '앞으로 8' },
          { given: 'if t.xcor() > 150:', note: '만약에 오른쪽 벽' },
          { box: [{ given: 't.setheading(180 - t.heading())', note: '튕기기 공식 ①' }] },
          { given: 'elif t.xcor() < -150:', note: '아니면 만약에 왼쪽 벽' },
          { box: [{ given: 't.setheading(180 - t.heading())', note: '튕기기 공식 ①' }] },
          { given: 'elif t.ycor() > 90:', note: '아니면 만약에 위쪽 벽' },
          { box: [{ given: 't.setheading(-t.heading())', note: '튕기기 공식 ②' }] },
          { given: 'elif t.ycor() < -90:', note: '아니면 만약에 아래쪽 벽' },
          { box: [{ given: 't.setheading(-t.heading())', note: '튕기기 공식 ②' }] },
        ] },
      ],
      done: '통통 튀는 공 완성! 🏀 벽마다 <b>elif</b> 로 하나씩 지켜요.',
    },
    {
      title: '도전! 벽 위치 바꾸기 📏',
      talk: `왼쪽 벽은 <b>오른쪽 벽(150) 숫자에 마이너스(-)</b>, 아래쪽 벽은 <b>위쪽 벽(90) 숫자에 마이너스</b> 를 붙이면 돼요.<br>빈칸 2개를 채워 보세요.`,
      lines: [
        { prep: true }, WALL,
        { given: 't.speed(0)', note: '가장 빠르게!' },
        { given: 't.color("blue")', note: '파란색 펜' },
        { given: 't.setheading(40)', note: '비스듬히 출발!' },
        { given: 'for i in range(250):', note: '250번 해 줘!' },
        { box: [
          { given: 't.forward(8)', note: '앞으로 8' },
          { given: 'if t.xcor() > 150:', note: '만약에 오른쪽 벽' },
          { box: [{ given: 't.setheading(180 - t.heading())', note: '튕기기 공식 ①' }] },
          { blank: 'elif t.xcor() < @:', answers: ['-150'], note: '아니면 만약에 왼쪽 벽' },
          { box: [{ given: 't.setheading(180 - t.heading())', note: '튕기기 공식 ①' }] },
          { given: 'elif t.ycor() > 90:', note: '아니면 만약에 위쪽 벽' },
          { box: [{ given: 't.setheading(-t.heading())', note: '튕기기 공식 ②' }] },
          { blank: 'elif t.ycor() < @:', answers: ['-90'], note: '아니면 만약에 아래쪽 벽' },
          { box: [{ given: 't.setheading(-t.heading())', note: '튕기기 공식 ②' }] },
        ] },
      ],
      hint: '첫 빈칸은 <b>-150</b>, 둘째 빈칸은 <b>-90</b> 이에요.',
      done: '네 벽을 모두 지키는 거북이 완성! 🏆 정말 잘했어요!',
    },
    {
      kind: 'free', title: '나만의 튕기기 🎨',
      talk: `출발 방향(<b>40</b>), 한 번에 가는 칸(<b>8</b>), 색깔을 마음대로 바꿔 보세요!<br><span class="small">출발 방향을 바꾸면 튕기는 길이 완전히 달라져요. 벽 숫자를 바꾸면 보이지 않는 벽이 돼요!</span>`,
      code: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nt.color("purple")\nt.pensize(2)\n\nt.setheading(40)\nfor i in range(400):\n    t.forward(8)\n    if t.xcor() > 150:\n        t.setheading(180 - t.heading())\n    elif t.xcor() < -150:\n        t.setheading(180 - t.heading())\n    elif t.ycor() > 90:\n        t.setheading(-t.heading())\n    elif t.ycor() < -90:\n        t.setheading(-t.heading())\n`,
      done: '오늘의 미션을 모두 끝냈어요! 🏆 아래 <b>완료</b> 버튼을 눌러 주세요.',
    },
  ],
};
</script>
<script src="lesson.js"></script>
