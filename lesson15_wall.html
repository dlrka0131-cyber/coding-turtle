<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>
<script>
// 빨간 벽 (x = 120 세로선)
const WALL = { fold: [
  { given: 'w = turtle.Turtle()', note: '벽 그릴 거북이 w' },
  { given: 'w.hideturtle()', note: '거북이 숨기기' },
  { given: 'w.color("red")', note: '빨간색' },
  { given: 'w.pensize(4)', note: '굵게' },
  { given: 'w.penup()', note: '펜 들기' },
  { given: 'w.goto(120, -100)', note: '벽 아래 끝으로' },
  { given: 'w.pendown()', note: '펜 내리기' },
  { given: 'w.goto(120, 100)', note: '벽 위 끝까지 선 긋기' },
], title: '빨간 벽 그리기 8줄 (신경 쓰지 마세요)' };
const LESSON = {
  num: 15,
  topic: '벽에 닿으면 돌아오기',
  words: [
    { emo: '📍', en: 'xcor', say: '엑스 코', ko: '가로 위치 (x)' },
    { emo: '🤔', en: 'if', say: '이프', ko: '만약에' },
    { emo: '▶️', en: '>', say: '', ko: '~보다 크면' },
    { emo: '🔄', en: 'right(180)', say: '라이트', ko: '뒤로 돌아' },
    { emo: '🗣️', en: 'print', say: '프린트', ko: '화면에 말해' },
  ],
  preview: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nw = turtle.Turtle()\nw.hideturtle()\nw.speed(0)\nw.color("red")\nw.pensize(4)\nw.penup()\nw.goto(120, -100)\nw.pendown()\nw.goto(120, 100)\nt.color("blue")\nfor i in range(40):\n    t.forward(10)\n    if t.xcor() > 120:\n        t.right(180)\n`,
  missions: [
    {
      kind: 'preview', title: '오늘 만들 것 🎁',
      talk: `거북이가 달려가다가 <b>빨간 벽</b>에 닿으면 <b>뒤로 돌아서</b> 돌아와요! 🧱<br>어떻게 거북이는 벽에 닿았는지 알까요? 비밀은 <b>"만약에"</b> 예요.`,
      words: true,
      done: '벽에 닿으니까 휙 돌아왔죠? 오늘 이걸 만들어요! <b>다음 →</b>',
    },
    {
      title: '내 가로 위치 알아보기 📍',
      talk: `거북이는 자기가 <b>어디에 있는지</b> 알 수 있어요.<br><b>t.xcor()</b> 는 <b>"나의 가로 위치는?"</b> 이에요. 한가운데는 <b>0</b>, 오른쪽으로 갈수록 숫자가 커져요.`,
      chips: [['t.xcor()', '내 가로 위치'], ['print( )', '화면에 말해']],
      lines: [{ prep: true }, { given: 't.forward(100)', note: '앞으로 100' }, { type: 'print(t.xcor())', note: '내 가로 위치는?' }],
      done: '오른쪽 아래에 <b>100.0</b> 이 나왔죠? 100만큼 갔으니까 가로 위치가 100이에요! 📍',
    },
    {
      title: '만약에 말하기 🤔',
      talk: `<b>if</b> 는 <b>"만약에 ~ 라면"</b> 이라는 뜻이에요.<br><b>"만약에 내 가로 위치가 120보다 크면, 벽이다! 라고 말해"</b> 라고 거북이에게 말해 봐요. 노란 상자 안의 일은 <b>조건이 맞을 때만</b> 해요.`,
      chips: [['if', '만약에'], ['t.xcor()', '내 가로 위치가'], ['> 120', '120보다 크면'], [':', '상자 시작!']],
      sentence: '🗣️ "만약에 내 가로 위치가 120보다 크면, 벽이다! 라고 말해!"',
      lines: [
        { prep: true }, WALL,
        { given: 't.forward(150)', note: '앞으로 150' },
        { type: 'if t.xcor() > 120:', note: '만약에 120보다 크면' },
        { box: [{ given: 'print("벽이다!")', note: '벽이다! 라고 말하기' }], label: '🤔 만약에 상자 안 (조건이 맞을 때만!)' },
      ],
      done: '150은 120보다 크니까 <b>"벽이다!"</b> 라고 말했어요! 🧱',
    },
    {
      title: '조건이 안 맞으면? 🙅',
      talk: `앞으로 가는 숫자를 바꿔 보세요. <b>벽(120)에 닿기 전</b>이면 <b>아무 일도</b> 안 일어나요.<br>60, 100, 150 을 눌러 비교해 보세요!`,
      lines: [
        { prep: true }, WALL,
        { blank: 't.forward(@)', answers: [null], start: ['100'], note: '앞으로 ?' },
        { given: 'if t.xcor() > 120:', note: '만약에 120보다 크면' },
        { box: [{ given: 'print("벽이다!")', note: '벽이다! 라고 말하기' }] },
      ],
      quick: ['60', '100', '150'],
      done: '120보다 작으면 조용하고, 120보다 크면 <b>"벽이다!"</b> 가 나와요. 조건이 맞을 때만 실행되는 거예요! 🤫',
    },
    {
      title: '벽에 닿으면 돌아오기 🔄',
      talk: `"벽이다!" 라고 말하는 대신 <b>뒤로 돌게</b> 해 봐요.<br><b>right(180)</b> 은 <b>반 바퀴(180도) 돌기</b>예요. 노란 상자 안의 줄을 직접 써 보세요!`,
      lines: [
        { prep: true }, WALL,
        { given: 't.forward(150)', note: '앞으로 150 (벽에 닿아요)' },
        { given: 'if t.xcor() > 120:', note: '만약에 벽에 닿으면' },
        { box: [{ type: 't.right(180)', note: '뒤로 돌기!' }], label: '🤔 만약에 상자 안' },
        { given: 't.forward(100)', note: '앞으로 100' },
      ],
      done: '벽에 닿자 뒤로 돌아서 돌아왔어요! 🐢↩️',
    },
    {
      title: '도전! 계속 지켜보기 👀',
      talk: `벽에 닿을 때까지 한 번만 확인하면 안 돼요. <b>10칸씩 가면서 계속</b> 확인해야 해요.<br>"앞으로 10 + 벽 확인"을 몇 번 반복할까요? 빈칸에 <b>40</b>을 써 보세요.`,
      lines: [
        { prep: true }, WALL,
        { given: 't.speed(0)', note: '가장 빠르게!' },
        { given: 't.color("blue")', note: '파란색 펜' },
        { blank: 'for i in range(@):', answers: ['40'], note: '몇 번 해 줘?' },
        { box: [
          { given: 't.forward(10)', note: '앞으로 10' },
          { given: 'if t.xcor() > 120:', note: '만약에 벽에 닿으면' },
          { box: [{ given: 't.right(180)', note: '뒤로 돌기!' }] },
        ] },
      ],
      hint: '<b>40</b> 번이면 거북이가 벽까지 갔다가 돌아와요. (10칸 × 40번 = 400칸)',
      done: '벽에 닿으면 돌아오는 거북이 완성! 🧱🐢 오늘의 핵심이에요.',
    },
    {
      kind: 'free', title: '나만의 벽 🎨',
      talk: `<b>벽 위치(120)</b>, <b>한 번에 가는 칸(10)</b>, <b>색깔</b>을 마음대로 바꿔 보세요!<br><span class="small">⚠️ 벽 숫자를 바꾸면 빨간 선은 그대로예요. 거북이가 보이지 않는 벽에서 돌아와요!</span>`,
      code: `import turtle\nt = turtle.Turtle()\nt.shape("turtle")\nt.speed(0)\nt.color("green")\n\nfor i in range(40):\n    t.forward(10)\n    if t.xcor() > 120:\n        t.right(180)\n`,
      done: '오늘의 미션을 모두 끝냈어요! 🏆 아래 <b>완료</b> 버튼을 눌러 주세요.',
    },
  ],
};
</script>
