<script>
// 4차시에서 만든 square 명령 (오늘은 이미 써 있다)
const SQUARE = [
  { given: 'def square():', note: '"square" 명령 만들기' },
  { box: [

    { box: [{ given: 't.forward(100)', note: '앞으로 100' }, { given: 't.left(90)', note: '왼쪽으로 돌기' }] },
  ], label: '📦 square 명령 상자 안' },
];
const FAST = { given: 't.speed(0)', note: '가장 빠르게!' };
const LESSON = {
  num: 5,
  topic: '네모로 꽃 피우기',

    { emo: '⬜', en: 'square()', say: '스퀘어', ko: '네모 명령 실행' },

        { prep: true }, ...SQUARE,
        { given: 'square()', note: '네모 1' },
        { blank: 't.left(@)', answers: [null], start: ['45'], note: '조금 돌기' },

        { box: [{ given: 'square()', note: '네모' }, { given: 't.left(45)', note: '45만큼 돌기' }] },

      hint: '꽃잎이 8장이니까 <b>8</b>번! <span class="small">(8번 × 45 = 360, 딱 한 바퀴예요)</span>',
      done: '16줄이 3줄로! 반복으로 꽃을 피웠어요 🌸',
    },
    {
      title: '도전! 꽃잎 12장 🌼',
      talk: `이번엔 꽃잎을 <b>12장</b>으로 늘려요. 12번 반복하면 <b>얼마씩</b> 돌아야 딱 한 바퀴가 될까요?<br>빈칸에 도는 숫자를 써 보세요.`,
      lines: [
        { prep: true }, { given: 't.color("orange")', note: '주황색 펜' }, FAST, ...SQUARE,
        { given: 'for i in range(12):', note: '12번 해 줘!' },
        { box: [{ given: 'square()', note: '네모' }, { blank: 't.left(@)', answers: ['30'], note: '얼마나 돌까?' }] },

      kind: 'free', title: '나만의 꽃 🎨',
      talk: `반복 횟수, 도는 각도, 색깔, 네모 크기를 마음대로 바꿔 보세요!<br><span class="small">횟수 × 각도 = 360 이 되면 딱 한 바퀴 예쁜 꽃이 돼요.</span>`,
